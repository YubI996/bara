name: tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bara
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: bara
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Security audit
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high

      - name: Lint & format (PHP)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Lint, format & typecheck (TS)
        run: |
          npm run check
          npm run types:check

      - name: Unit, feature & architecture tests
        run: php artisan test

      - name: E2E + accessibility (Playwright + axe)
        if: matrix.php == '8.5'
        env:
          E2E_DB_DATABASE: bara_e2e
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U bara -d bara_test -c 'CREATE DATABASE bara_e2e'
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Playwright report
        if: failure() && matrix.php == '8.5'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
